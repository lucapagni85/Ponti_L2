<style>
:root{--bg:#e9eef2;--ink:#14202b;--mut:#5b6b78;--ac:#0b5a8a;--ln:#b9c5cf;--ok:#1d7a46;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}
header h1{font-size:19px;margin:0;flex:1}
header small{opacity:.85}
main{max-width:900px;margin:0 auto;padding:12px}
button{font:inherit;min-height:48px;padding:0 16px;border:1.5px solid var(--ac);background:#fff;color:var(--ac);border-radius:8px}
button.p{background:var(--ac);color:#fff}
header button{background:transparent;color:#fff;border-color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.pt{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;gap:12px}
.pt b{flex:1}.pt span{color:var(--mut);font-size:15px}
details{background:var(--card);border:1px solid var(--ln);border-radius:8px;margin:10px 0}
summary{padding:14px;font-weight:700;cursor:pointer;min-height:48px}
.in{padding:4px 14px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.w{grid-column:1/-1}
label{display:block;font-size:15px;color:var(--mut)}
input,textarea{display:block;width:100%;min-height:48px;margin-top:4px;font:inherit;color:var(--ink);padding:8px 10px;border:1.5px solid var(--ln);border-radius:8px;background:#fff}
input:focus,textarea:focus,button:focus-visible{outline:3px solid #f0a500;outline-offset:1px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.c{border-color:var(--ln);color:var(--ink)}
.c.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.tb{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--ln);padding:3px;font-size:14px;text-align:left;min-width:92px}
td input{margin:0;min-height:44px}
th:first-child{min-width:150px}
#st{font-size:14px}
h3{margin:14px 2px 4px;font-size:16px}
.dr{background:var(--card);border:1px solid var(--ln);border-radius:8px;margin:8px 0;padding:8px 10px}
.dr.on{border-left:6px solid var(--ac)}
.dh{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.dh small{color:var(--mut)}
.gb{background:#e1e8ee;border-radius:6px;padding:2px 8px;font-weight:700}
.c.ps.on{background:#b3261e;border-color:#b3261e}
.dr label{margin-top:6px}
h2{font-size:18px;margin:24px 2px 6px;padding-top:12px;border-top:2px solid var(--ln)}
main>h2:first-child{border:0;margin-top:4px;padding-top:0}
.pt{flex-wrap:wrap}.pt b{min-width:160px}
.dd{border:1px solid var(--ln);border-radius:8px;padding:8px 10px}.dd small{color:var(--mut)}
@media print{header,button,.row{display:none}body{background:#fff}}
.ph{display:flex;gap:8px;margin-top:6px}.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th img{height:72px;border:1px solid var(--ln);border-radius:6px}

#pr{display:none}@page{size:A4 landscape;margin:0}
.pg{position:relative;width:297mm;height:210mm;padding:8mm 10mm;box-sizing:border-box;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#000;break-after:page}
.gb2{background:#c6e0b4;border-bottom:1.5px solid #8fb36c;text-align:center;font-weight:700;font-size:11pt;padding:2mm;margin-bottom:4mm}
.sh{display:flex;justify-content:space-between;align-items:center;background:#1f4e79;color:#fff;border:2px solid #0b2a47;padding:2.5mm 6mm;margin-bottom:3mm}.sh span{font-size:21pt;font-weight:700}.sh b{font-size:16pt}.pg svg{display:block;margin:0 auto;height:146mm;width:auto;max-width:100%}
.pg table{border-collapse:collapse;width:100%}.pg td,.pg th{border:1px solid #888;padding:1.6mm 3mm;font-size:10.5pt;text-align:center}
.t1 th{background:#ddebf7;text-align:left;font-weight:400;width:38%}.t1 td{text-align:left}.t2 .cl{width:34%}
.pn{position:absolute;right:10mm;bottom:5mm;font-size:9pt}.pg small{font-size:8.5pt;display:block;margin-top:2mm}
@media print{body.pp>header,body.pp>main{display:none}body.pp #pr{display:block}body.pp{background:#fff}}
</style></head><body>

const $=id=>document.getElementById(id);
const idb=new Promise(r=>{const q=indexedDB.open('ponti_l1',2);q.onupgradeneeded=()=>{const d=q.result;['p','f'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};q.onsuccess=()=>r(q.result)});

 (p2.length?p2.map(p=>`<div class="pt"><b>${E(p.name)}</b><span>${(p.d||[]).length} schede</span><button class="p" data-a="o2" data-id="${p.id}">Apri</button><button data-a="del" data-id="${p.id}">Elimina</button></div>`).join(''):'<p>Nessun ponte. Tocca «Nuovo ponte» per iniziare.</p>');

 const ph=e.target.dataset.ph;if(ph&&e.target.files[0]){const f=e.target.files[0],T=e.target.dataset;e.target.value='';try{await addFoto(ph,T.d,T.c,f)}catch(x){alert('Foto non salvata: '+x.message)}return}

 [['na',11],['nr',12],['np',13]].forEach(([s,i])=>{if(st==s)cross(c,CX[i],CX[i+1],yb,y)});
 c.setFillColor(BK);
 if(v[k+'.f'])tf(c,v[k+'.f'],CX[14],yb+5.5,CX[15]-CX[14],'Helvetica',7);
 if(v[k+'.n'])tf(c,v[k+'.n'],CX[15],yb+5.5,CX[16]-CX[15],'Helvetica',7);
 return yb}

function sottotitolo(c,y,t){const h=13,yb=y-h;c.setFillColor(HD);c.rect(CX[0],yb,CX[16]-CX[0],h,0,1);c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(CX[0],yb,CX[16]-CX[0],h,1,0);c.setFillColor(BK);c.setFont('Helvetica-BoldOblique',7.5);c.drawString(CX[0]+3,yb+3.5,t);return yb}

function piede(c,d,y){
 const dv=d.v||{},fl=[];
 if(dv.crit=='1')fl.push('ELEMENTO CRITICO (§ 3.3 Linee Guida)');
 if(dv.cond=='1')fl.push('CONDIZIONE CRITICA IN ATTO');
 const hn=46,need=hn+62;if(y-need<M)return false;
 c.setFillColor(BK);c.setFont('Helvetica-Bold',8);c.drawString(M,y-12,'Eventuali note');
 c.setStrokeColor(BK);c.setLineWidth(1);c.rect(M,y-12-hn+4,CX[16]-M,hn-4);
 c.setFont('Helvetica',8);let ty=y-24;
 fl.concat(dv.note?[dv.note]:[]).forEach(t=>String(t).split('\n').forEach(ln=>{c.drawString(M+4,ty,ln.slice(0,140));ty-=10}));
 if(dv.fg)c.drawString(M+4,ty,'Foto generali: '+dv.fg);
 let yl=y-12-hn-4;c.setFont('Helvetica',6.8);
 ["PS  spuntare se si ritiene che la presenza del difetto possa compromettere la statica dell'opera. Associato ai soli difetti di gravità 4 e 5.",
  'NA  spuntare se il difetto non è applicabile alla tipologia di manufatto in esame.',
  'NR  spuntare se il difetto non si può rilevare mediante ispezione visiva (es. vegetazione invasiva, zone non accessibili).',
  'NP  spuntare se il difetto non è stato rilevato.',
  'N° foto: numerazione digitale delle foto relative allo specifico difetto (catalogate, numerate e con didascalia).'].forEach(t=>{c.drawString(M,yl,t);yl-=9});
 return true}

function scheda(c,ponte,d){
 const cd=CAT[d.s],v=d.v||{};
 let y=testata(c,intestazione(c,d,ponte)),i=-1;
 cd.r.forEach(r=>{
  if(!Array.isArray(r)){if(y-13<M+20){c.showPage();y=testata(c,intestazione(c,d,ponte))}y=sottotitolo(c,y,r);return}
  i++;if(y-ROWH<M+20){c.showPage();y=testata(c,intestazione(c,d,ponte))}
  y=riga(c,y,r,v,'r'+i)});
 if(!piede(c,d,y-4)){c.showPage();piede(c,d,H-M)}
 c.showPage()}

/* --- scheda 20: elementi accessori --- */
const BL2=[BL[0],['pg','Presente come guardiavia'],['pp','Presente come parapetto'],...BL.slice(1)];
function tabella(c,xs,y,h,fn,n){for(let i=0;i<n;i++){const yb=y-h;for(let a=0;a<xs.length-1;a++){c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(xs[a],yb,xs[a+1]-xs[a],h,1,0)}fn(i,yb);y=yb}return y}
function boxVal(c,x,y,w,h,lab,val){c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(x,y-h,w,h,1,0);c.setFont('Helvetica',6.5);c.setFillColor(DK);c.drawString(x+3,y-8,lab);c.setFillColor(BK);tf(c,val,x,y-h+4,w,'Helvetica',9)}
function chk(c,x,y,on,lab,size=8){c.setStrokeColor(GR);c.setLineWidth(.6);c.rect(x,y,9,9,1,0);if(on)cross(c,x-1.5,x+10.5,y-1.5,y+10.5);c.setFillColor(BK);c.setFont('Helvetica',size);c.drawString(x+13,y+1.5,lab)}
function scheda20(c,ponte,d){
 const v=d.v||{};let y=intestazione(c,d,ponte);const h=24;let gx=M;
 [['N° corsie','ncorsie',70],['Larghezza carreggiata [m]','lcarr',120],['Larghezza marciapiede [m]','lmarc',120],['Altezza marciapiede [m]','hmarc',115]].forEach(([lab,k,w])=>{boxVal(c,gx,y,w,h,lab,v[k]||'');gx+=w});
 c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(gx,y-h,CX[16]-gx,h,1,0);
 c.setFont('Helvetica',6.5);c.setFillColor(DK);c.drawString(gx+3,y-8,'Marciapiede / Barriere laterali');c.setFillColor(BK);
 let cx=gx+4;
 [['0','NO'],['1','SI – 1 lato'],['2','SI – 2 lati']].forEach(([val,lab])=>{chk(c,cx,y-h+4,v.marc===val,lab,7.5);cx+=18+c.stringWidth(lab,'Helvetica',7.5)+8});
 cx+=10;
 ['1','2','3'].forEach(val=>{chk(c,cx,y-h+4,v.caso===val,'Caso '+val,7.5);cx+=18+c.stringWidth('Caso '+val,'Helvetica',7.5)+8});
 y-=h+8;
 const LW=540,xs=[M,M+50,M+160,M+290,M+322,M+380,M+LW],rh=15,hy=y;
 c.setFillColor(HD);c.rect(M,y-18,LW,18,0,1);c.setFillColor(BK);
 for(let a=0;a<6;a++){c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(xs[a],y-18,xs[a+1]-xs[a],18,1,0)}
 c.setFont('Helvetica-Bold',7);
 ['Codice','Elemento ispezionato','Descrizione difetto','Presente','N° foto','Note'].forEach((t,a)=>c.drawCentredString((xs[a]+xs[a+1])/2,y-12,t));
 y-=18;
 const yl=tabella(c,xs,y,rh,(i,yb)=>{
  const [n,g,t]=EL[i],k='e'+i;c.setFillColor(BK);
  tf(c,'El.Acc_'+n,xs[0],yb+4.5,xs[1]-xs[0],'Helvetica',6.5);
  tf(c,g,xs[1],yb+4.5,xs[2]-xs[1],'Helvetica-Bold',7);
  tf(c,t,xs[2],yb+4.5,xs[3]-xs[2],'Helvetica',7.5);
  if(v[k])cross(c,xs[3],xs[4],yb,yb+rh);
  tf(c,v[k+'.f']||'',xs[4],yb+4.5,xs[5]-xs[4],'Helvetica',7);
  tf(c,v[k+'.n']||'',xs[5],yb+4.5,xs[6]-xs[5],'Helvetica',7)},EL.length);
 const RX=M+LW+12,RW=CX[16]-RX;
 const xr=[RX,RX+RW*.46,RX+RW*.46+22,RX+RW*.73,RX+RW*.73+22,RX+RW].map(a=>Math.round(a*10)/10);
 let y2=hy;
 c.setFillColor(HD);c.rect(RX,y2-30,RW,30,0,1);c.setFillColor(BK);c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(RX,y2-30,RW,30,1,0);
 c.setFont('Helvetica-Bold',7);
 c.drawCentredString((xr[1]+xr[3])/2,y2-10,'GUARDIAVIA');c.drawCentredString((xr[3]+xr[5])/2,y2-10,'PARAPETTO');c.drawCentredString((xr[0]+xr[1])/2,y2-20,'Barriere laterali');
 c.setFont('Helvetica-Bold',6);
 ['Pres.','N° foto','Pres.','N° foto'].forEach((t,a)=>c.drawCentredString((xr[a+1]+xr[a+2])/2,y2-25,t));
 y2-=30;const caso=v.caso,gr=(x0,x1,yb)=>{c.setFillColor(GY);c.rect(x0,yb,x1-x0,rh,0,1);c.setStrokeColor(GR);c.setLineWidth(.5);c.rect(x0,yb,x1-x0,rh,1,0)};
 tabella(c,xr,y2,rh,(i,yb)=>{
  if(i<BL2.length){const [k,lab]=BL2[i],pp=k=='pg'||k=='pp';
   c.setFillColor(BK);tf(c,lab,xr[0],yb+4.5,xr[1]-xr[0],'Helvetica',7.5);
   [['g.',1],['p.',3]].forEach(([pre,a])=>{
    const grigio=(pre=='p.'&&(caso=='1'||pp))||(pre=='g.'&&pp&&caso!='3');
    if(grigio){gr(xr[a],xr[a+1],yb);gr(xr[a+1],xr[a+2],yb);return}
    if(v[pre+k])cross(c,xr[a],xr[a+1],yb,yb+rh);
    c.setFillColor(BK);tf(c,v[pre+k+'.f']||'',xr[a+1],yb+4.5,xr[a+2]-xr[a+1],'Helvetica',6.5)})
  }else{
   c.setFillColor(BK);tf(c,'Altezza (cm)',xr[0],yb+4.5,xr[1]-xr[0],'Helvetica-Bold',7.5);
   [['g.',1],['p.',3]].forEach(([pre,a])=>{
    if(pre=='p.'&&caso=='1')gr(xr[a],xr[a+2],yb);
    else{c.setFillColor(BK);tf(c,v[pre+'h']||'',xr[a],yb+4.5,xr[a+2]-xr[a],'Helvetica',8)}})}
 },BL2.length+1);
 const yb=Math.min(yl,y2-rh*(BL2.length+1))-14;
 c.setFillColor(BK);c.setFont('Helvetica',8);if(v.fg)c.drawString(M,yb,'Foto generali: '+v.fg);
 c.showPage()}

/* --- allegato fotografico: 4 foto per pagina (2x2) --- */
const numeriFoto=d=>{const o=new Set();Object.entries(d.v||{}).forEach(([k,val])=>{if(k=='fg'||k.endsWith('.f'))(String(val||'').match(/\d+/g)||[]).forEach(t=>o.add(t.padStart(3,'0')))});return[...o].sort((a,b)=>a-b)};
function allegato(c,doc,ponte,d,foto,cache){
 const nums=numeriFoto(d);if(!nums.length)return 0;
 const tit='Allegato fotografico – Scheda '+d.s+' · '+NM(d.s)+(d.v&&d.v.n?'  N° '+d.v.n:'');
 const gap=10,top=H-M-30,cw=(W-2*M-gap)/2,ch=(top-M-gap)/2,np=Math.ceil(nums.length/4);
 for(let p=0;p<np;p++){
  c.setFillColor(YE);c.setStrokeColor(GR);c.setLineWidth(.6);c.rect(M,H-M-24,W-2*M,24,1,1);
  c.setFillColor(BK);c.setFont('Helvetica-Bold',11);c.drawString(M+4,H-M-16,tit);
  c.setFont('Helvetica',8);c.drawRightString(W-M-4,H-M-16,'Ponte '+(ponte.name||'')+' · pag. foto '+(p+1)+'/'+np);
  nums.slice(p*4,p*4+4).forEach((n,j)=>{
   const x0=M+(j%2)*(cw+gap),yb=top-Math.floor(j/2)*(ch+gap)-ch,r=foto[n],capH=16;
   c.setStrokeColor(GR);c.setLineWidth(.6);c.rect(x0,yb,cw,ch,1,0);
   c.setFillColor(BK);tf(c,((r&&r.d)||'Foto')+'_'+n,x0+2,yb+5,cw-4,'Helvetica-Bold',9,6);
   c.setStrokeColor(GR);c.line(x0,yb+capH,x0+cw,yb+capH);
   const ax=x0+4,ay=yb+capH+4,aw=cw-8,ah=ch-capH-8;
   try{
    if(!r)throw 0;
    if(!(n in cache))cache[n]=doc.addImage(r.u8);
    const [iw,ih]=doc.imgSize(cache[n]),sc=Math.min(aw/iw,ah/ih),w=iw*sc,h=ih*sc;
    c.drawImage(cache[n],ax+(aw-w)/2,ay+(ah-h)/2,w,h)
   }catch(e){c.setFont('Helvetica-Oblique',9);c.setFillColor('#aa0000');c.drawCentredString(x0+cw/2,yb+ch/2,'Foto '+n+' non disponibile')}});
  c.showPage()}
 return nums.length}

/* --- ingresso: schede già filtrate; loadFoto(n) -> {d,u8}|null --- */
async function build(ponte,schede,loadFoto){
 const doc=Doc(),c=doc.c,foto={},cache={};
 const L=schede.slice().sort((a,b)=>a.s-b.s||String((a.v||{}).n||'').localeCompare(String((b.v||{}).n||''),'it',{numeric:true}));
 for(const d of L)for(const n of numeriFoto(d))if(!(n in foto))foto[n]=await loadFoto(n);
 for(const d of L){if(d.s==20)scheda20(c,ponte,d);else if(CAT[d.s])scheda(c,ponte,d);else continue;allegato(c,doc,ponte,d,foto,cache)}
 return doc.finish('Schede difetti - '+(ponte.name||''))}
return{build}})();

const dlb=async(bl,n,ty)=>{const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=n;l.click();if(navigator.share&&navigator.canShare){const f=new File([bl],n,{type:ty});if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:n})}catch(e){}}}};
async function expPdf(id){
 const L=id?cur.d.filter(x=>x.id==id):cur.d.filter(compiled);
 if(!L.length){alert('Nessuna scheda compilata da esportare');return}
 const st=$('st');if(st)st.textContent='Creo il PDF…';
 try{
  await put(cur);
  const F=new Map((await listF(cur.id)).map(r=>[r.n,r])),sf=t=>String(t||'').replace(/[^\w-]+/g,'_');
  const bl=await PDFX.build({name:cur.name,v:cur.v},L,async n=>{const r=F.get(n);return r?{d:r.d,u8:new Uint8Array(await r.b.arrayBuffer())}:null});
  await dlb(bl,'schede_'+sf(cur.name)+(id?'_sch'+L[0].s+(L[0].v.n?'-'+sf(L[0].v.n):''):'')+'.pdf','application/pdf')
 }catch(e){alert('PDF non creato: '+e.message)}
 if(st)st.textContent='Salvato'}
home();
